query CartValidationsGenerateRunInput {
  buyerJourney {
    step
  }
  cart {
    buyerIdentity {
      email
      phone
      isAuthenticated
      customer {
        id
      }
    }
    lines {
      merchandise {
        __typename
        ... on ProductVariant {
          requiresShipping
        }
        ... on CustomProduct {
          requiresShipping
          title
        }
      }
    }
    deliveryGroups {
      deliveryAddress {
        address1
        phone
      }
      selectedDeliveryOption {
        deliveryMethodType
      }
    }
  }
}
